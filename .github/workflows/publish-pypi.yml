name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python .github/scripts/check-release.py
      - name: Build source and Linux CPython 3.9 wheel
        run: |
          docker run --rm -v "$PWD:/io" -w /io \
            quay.io/pypa/manylinux2014_x86_64 \
            bash .github/scripts/build-release.sh
      - name: Install and test distribution
        env:
          MPLBACKEND: Agg
        run: |
          python -m pip install dist/*.whl twine
          python -m twine check dist/*
          cd /tmp
          python - <<'PY'
          import gsidiag
          import diag2python
          ax = gsidiag.geoMap()
          ax.figure.canvas.draw()
          print('Installed readDiag:', gsidiag.__version__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/readdiag/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish via PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
